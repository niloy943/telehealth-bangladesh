  <!-- Global Error Logger -->
  <script>
    window.addEventListener('error', function (e) {
      console.error('Captured Global Window Error:', e.error || e.message);
      var errDiv = document.getElementById('global-fatal-error');
      if (!errDiv) {
        errDiv = document.createElement('div');
        errDiv.id = 'global-fatal-error';
        errDiv.style = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;box-shadow:0 10px 25px rgba(0,0,0,0.5);max-height:80vh;overflow-y:auto;';
        document.body.prepend(errDiv);
      }
      errDiv.innerHTML = '<h2 style="font-weight:bold;font-size:18px;margin-bottom:8px;">⚠️ Fatal Script Error Detected:</h2>' +
        '<div><strong>Message:</strong> ' + (e.message || 'Unknown Error') + '</div>' +
        '<div><strong>Source:</strong> ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + '</div>' +
        (e.error && e.error.stack ? '<pre style="background:#7f1d1d;padding:10px;margin-top:10px;border-radius:6px;">' + e.error.stack + '</pre>' : '');
    });
    window.addEventListener('unhandledrejection', function (e) {
      console.error('Captured Global Unhandled Rejection:', e.reason);
      var errDiv = document.getElementById('global-fatal-error');
      if (!errDiv) {
        errDiv = document.createElement('div');
        errDiv.id = 'global-fatal-error';
        errDiv.style = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;box-shadow:0 10px 25px rgba(0,0,0,0.5);max-height:80vh;overflow-y:auto;';
        document.body.prepend(errDiv);
      }
      errDiv.innerHTML = '<h2 style="font-weight:bold;font-size:18px;margin-bottom:8px;">⚠️ Unhandled Promise Rejection:</h2>' +
        '<pre style="background:#7f1d1d;padding:10px;margin-top:10px;border-radius:6px;">' + (e.reason ? (e.reason.stack || e.reason) : 'Unknown reason') + '</pre>';
    });
  </script>
