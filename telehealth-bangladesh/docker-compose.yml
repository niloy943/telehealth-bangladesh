version: "3.8"

services:
  # 1. Django Backend API
  django-backend:
    build:
      context: ./backend
    container_name: django-backend
    restart: always
    volumes:
      - sqlite-data:/app/db
    environment:
      - DB_SQLITE_PATH=/app/db/db.sqlite3
      - TELEHEALTH_SECRET_KEY=production-secret-key-change-me-2026
      - DEBUG=False
    expose:
      - "8000"

  # 2. Node.js Authentication Service
  node-auth:
    build:
      context: ./node-backend
    container_name: node-auth
    restart: always
    volumes:
      - sqlite-data:/app/db
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_DIALECT=sqlite
      - DB_SQLITE_PATH=/app/db/db.sqlite3
      - JWT_SECRET=super_secret_jwt_signature_key_2026_swastho
    expose:
      - "5000"
    depends_on:
      - django-backend

  # 3. FastAPI Upstream Worker (Vision/AI)
  fastapi-worker:
    build:
      context: ./fastapi-backend
    container_name: fastapi-worker
    restart: always
    volumes:
      - sqlite-data:/app/db
    environment:
      - DB_SQLITE_PATH=/app/db/db.sqlite3
    expose:
      - "6000"
    depends_on:
      - django-backend

  # 4. Compiled React Frontend App
  frontend:
    build:
      context: ./frontend-src
    container_name: frontend-app
    restart: always
    expose:
      - "80"

  # 5. Reverse Proxy / Gateway Router
  nginx-gateway:
    image: nginx:stable-alpine
    container_name: nginx-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - django-backend
      - node-auth
      - fastapi-worker

volumes:
  sqlite-data:
