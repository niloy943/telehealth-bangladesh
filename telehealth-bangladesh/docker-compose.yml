version: "3.8"

services:
  # 1. Primary PostgreSQL 16 Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: telehealth-postgres
    restart: always
    environment:
      - POSTGRES_DB=telehealth_bangladesh
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telehealth_bangladesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & ASGI WebSocket Channel Layer
  redis:
    image: redis:7-alpine
    container_name: telehealth-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Django Backend API (Daphne ASGI + REST Framework + Blockchain)
  django-backend:
    build:
      context: ./backend
    container_name: django-backend
    restart: always
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=telehealth_bangladesh
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TELEHEALTH_SECRET_KEY=production-secret-key-change-me-2026
      - DEBUG=False
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Node.js Authentication & Password Recovery Microservice
  node-auth:
    build:
      context: ./node-backend
    container_name: node-auth
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=telehealth_bangladesh
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=super_secret_jwt_signature_key_2026_swastho
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy

  # 5. FastAPI Upstream Worker (Computer Vision / AI Health Assistant)
  fastapi-worker:
    build:
      context: ./fastapi-backend
    container_name: fastapi-worker
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=telehealth_bangladesh
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    expose:
      - "6000"
    depends_on:
      postgres:
        condition: service_healthy

  # 6. Compiled React Frontend Single Page Application
  frontend:
    build:
      context: ./frontend-src
    container_name: frontend-app
    restart: always
    expose:
      - "80"

  # 7. Reverse Proxy & Gateway Router (Nginx)
  nginx-gateway:
    image: nginx:stable-alpine
    container_name: nginx-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - django-backend
      - node-auth
      - fastapi-worker

volumes:
  postgres-data:
  redis-data:
