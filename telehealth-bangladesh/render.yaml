databases:
  - name: telehealth-db
    databaseName: telehealth_bd
    user: postgres
    plan: free

services:
  # 1. Django Backend API
  - type: web
    name: telehealth-django-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py migrate && python backend/manage.py seed_data --reset
    startCommand: cd backend && daphne -b 0.0.0.0 -p $PORT telehealth_project.asgi:application
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: TELEHEALTH_SECRET_KEY
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: telehealth-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: telehealth-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: telehealth-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: telehealth-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: telehealth-db
          property: password

  # 2. Node.js Authentication Service
  - type: web
    name: telehealth-node-auth
    env: node
    buildCommand: cd node-backend && npm install
    startCommand: cd node-backend && npm start
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: telehealth-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: telehealth-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: telehealth-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: telehealth-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: telehealth-db
          property: password

  # 3. FastAPI Upstream Worker (Vision/AI)
  - type: web
    name: telehealth-fastapi-worker
    env: python
    buildCommand: pip install -r fastapi-backend/requirements.txt
    startCommand: cd fastapi-backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: telehealth-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: telehealth-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: telehealth-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: telehealth-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: telehealth-db
          property: password

  # 4. React Frontend Static Site
  - type: static
    name: telehealth-frontend
    buildCommand: cd frontend-src && npm install && npm run build
    publishPath: frontend
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: telehealth-django-backend
          type: web
          property: host
      - key: VITE_AUTH_API_BASE
        fromService:
          name: telehealth-node-auth
          type: web
          property: host
      - key: VITE_FASTAPI_BASE
        fromService:
          name: telehealth-fastapi-worker
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
