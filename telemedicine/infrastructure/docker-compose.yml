version: '3.8'

services:
  # 1. Primary Relational Store
  postgres:
    image: postgres:16-alpine
    container_name: telemedicine-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-telemedicine_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis for BullMQ Asynchronous Job Queues
  redis:
    image: redis:7-alpine
    container_name: telemedicine-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Node.js Express Secure Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: telemedicine-backend
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/telemedicine_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KMS_MASTER_KEY: ${KMS_MASTER_KEY:-dev-master-kms-key-32-bytes-long!}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

